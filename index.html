<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luna PvP Prototype</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0f;
        color: #e0e0e8;
        font-family: system-ui, -apple-system, sans-serif;
      }

      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #inspector-root {
        position: fixed;
        top: 0;
        right: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <div id="inspector-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
