<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luna PvP Prototype</title>
    <style>
      @font-face {
        font-family: 'Fixedsys';
        src: url('/fonts/FixedsysExcelsior.woff2') format('woff2'),
             local('Fixedsys'), local('FixedSys'),
             local('Fixedsys Excelsior 3.01'), local('Courier New');
        font-display: swap;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Fixedsys', 'FixedSys', 'Courier New', monospace !important;
        letter-spacing: 0.5px;
      }

      :root {
        --retro-cursor: crosshair;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: var(--retro-bg-dark, #06060c);
        color: var(--retro-text-primary, #e0f8ff);
      }

      #game-canvas,
      #vfx-canvas {
        cursor: crosshair;
      }

      button,
      select,
      input,
      a,
      label,
      #inspector-root,
      #inspector-root * {
        cursor: inherit;
      }

      button,
      select,
      input[type="range"],
      input[type="checkbox"],
      input[type="text"],
      input[type="password"] {
        cursor: pointer;
      }

      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
        position: relative;
        z-index: 0;
      }

      #inspector-root {
        position: fixed;
        inset: 0;
        z-index: 9100;
        pointer-events: none;
      }

      #inspector-root .inspector-drag-handle {
        cursor: grab;
      }

      #inspector-root .inspector-drag-handle:active {
        cursor: grabbing;
      }

      #inspector-root .inspector-resize-n,
      #inspector-root .inspector-resize-s {
        cursor: ns-resize;
      }

      #inspector-root .inspector-resize-e,
      #inspector-root .inspector-resize-w {
        cursor: ew-resize;
      }

      #inspector-root .inspector-resize-ne,
      #inspector-root .inspector-resize-sw {
        cursor: nesw-resize;
      }

      #inspector-root .inspector-resize-nw,
      #inspector-root .inspector-resize-se {
        cursor: nwse-resize;
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <div id="inspector-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
