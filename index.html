<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luna PvP Prototype</title>
    <style>
      @font-face {
        font-family: 'Fixedsys';
        src: url('/fonts/FixedsysExcelsior.woff2') format('woff2'),
             local('Fixedsys'), local('FixedSys'),
             local('Fixedsys Excelsior 3.01'), local('Courier New');
        font-display: swap;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Fixedsys', 'FixedSys', 'Courier New', monospace !important;
        letter-spacing: 0.5px;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #06060c;
        color: #e0f8ff;
      }

      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
        position: relative;
        z-index: 0;
      }

      #inspector-root {
        position: fixed;
        top: 0;
        right: 0;
        z-index: 10;
        pointer-events: none;
      }

      #crt-bezel {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        border-radius: 18px;
        box-shadow:
          inset 0 0 80px rgba(0, 0, 0, 0.75),
          inset 0 0 2px rgba(0, 229, 255, 0.15),
          0 0 0 14px #0a0a12,
          0 0 0 16px rgba(0, 229, 255, 0.08);
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.03) 0%,
          transparent 40%,
          transparent 60%,
          rgba(0, 0, 0, 0.15) 100%
        );
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <div id="crt-bezel" aria-hidden="true"></div>
    <div id="inspector-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
