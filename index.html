<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luna PvP Prototype</title>
    <style>
      @font-face {
        font-family: 'Fixedsys';
        src: url('/fonts/FixedsysExcelsior.woff2') format('woff2'),
             local('Fixedsys'), local('FixedSys'),
             local('Fixedsys Excelsior 3.01'), local('Courier New');
        font-display: swap;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Fixedsys', 'FixedSys', 'Courier New', monospace !important;
        letter-spacing: 0.5px;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #06060c;
        color: #e0f8ff;
      }

      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
        position: relative;
        z-index: 0;
      }

      #inspector-root {
        position: fixed;
        top: 0;
        right: 0;
        z-index: 10;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <div id="inspector-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
